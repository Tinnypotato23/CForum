<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CForum</title>
  
  <!-- This script automatically triggers browser translation features instantly -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Changes the structural language to English right before rendering completes
      setTimeout(() => {
        document.documentElement.lang = 'en';
      }, 500);
    });
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
